services:
  - type: web
    name: windsight-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WINDSIGHT_DATABASE_URL
        value: sqlite:///windsight.db
